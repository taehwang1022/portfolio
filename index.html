<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>김태황 포트폴리오</title>
  <style>
    body {
      background: #f9f9f9;
      font-family: "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background: #fff;
      padding: 20px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
    }

    header a {
      margin: 0 20px;
      text-decoration: none;
      color: #111;
      font-weight: bold;
      font-size: 1.1em;
      transition: color 0.3s;
      cursor: pointer;
    }

    header a:hover {
      color: #555;
    }

    .page {
      display: block;
      max-width: 900px;
      width: 90%;
      margin: 30px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    .spacer {
      height: 30px;
    }
  </style>
</head>
<body>

<header>
  <a onclick="scrollToCenter('page2')">자기소개</a>
  <a onclick="scrollToCenter('page3')">경력기술서</a>
  <a onclick="scrollToCenter('page4')">KIST 인턴 경험</a>
  <a onclick="scrollToCenter('page5')">국제 협력 프로젝트</a>
  <a onclick="scrollToCenter('page6')">교내 프로젝트</a>
</header>

<!-- 페이지 이미지 -->
<div class="spacer" id="page2"></div>
<img class="page" src="003.jpg" alt="자기소개">

<div class="spacer" id="page3"></div>
<img class="page" src="004.jpg" alt="경력기술서">

<div class="spacer" id="page4"></div>
<img class="page" src="005.jpg" alt="국제 협력 프로젝트">

<div class="spacer" id="page5"></div>
<img class="page" src="006.jpg" alt="KIST 인턴 경험">

<div class="spacer" id="page6"></div>
<img class="page" src="007.jpg" alt="교내 프로젝트">

<!-- 중앙 정렬 스크롤 기능 -->
<script>
  function scrollToCenter(id) {
    const target = document.getElementById(id);
    const image = target.nextElementSibling;
    if (!image) return;

    const imageHeight = image.offsetHeight;
    const offsetTop = target.getBoundingClientRect().top + window.pageYOffset;
    const scrollY = offsetTop - (window.innerHeight / 2) + (imageHeight / 2);

    window.scrollTo({ top: scrollY, behavior: 'smooth' });
  }
</script>

</body>
</html>
